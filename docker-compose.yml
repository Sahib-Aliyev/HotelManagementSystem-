services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_db
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://hotel:hotel@db:5432/hotel_db
      # Override this in a real deployment.
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-change-me-before-production}
      CORS_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"
    # APP_ENV=production skips create_all, so migrate then serve.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  hotel_pgdata:
