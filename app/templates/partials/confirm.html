{# Confirmation modal. Bind with confirmMixin() in the page component. #}
{% macro confirm_dialog() -%}
<div x-show="confirm.open" style="display:none" class="fixed inset-0 z-50 grid place-items-center p-4"
     @keydown.escape.window="confirm.open && settleConfirm(false)">
  <div @click="settleConfirm(false)" x-show="confirm.open" x-transition.opacity
       class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-sm animate-pop-in rounded-2xl bg-white p-6 shadow-pop dark:bg-slate-900"
       role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="flex items-start gap-3.5">
      <span class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl ring-1 ring-inset"
            :class="confirm.danger
              ? 'bg-red-50 text-red-600 ring-red-200 dark:bg-red-500/15 dark:text-red-400 dark:ring-red-500/30'
              : 'bg-brand-50 text-brand-700 ring-brand-200 dark:bg-brand-500/15 dark:text-brand-200 dark:ring-brand-500/30'">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M12 9v4m0 4h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>
        </svg>
      </span>
      <div class="min-w-0">
        <h3 id="confirm-title" class="text-base font-semibold tracking-tight text-slate-900 dark:text-white"
            x-text="confirm.title"></h3>
        <p class="mt-1.5 text-sm leading-relaxed text-slate-600 dark:text-slate-400" x-text="confirm.message"></p>
      </div>
    </div>
    <div class="mt-6 flex gap-2">
      <button @click="settleConfirm(false)" class="btn btn-outline flex-1">Cancel</button>
      <button @click="settleConfirm(true)" x-ref="confirmButton"
              class="btn flex-1"
              :class="confirm.danger ? 'btn-solid-danger' : 'btn-primary'"
              x-text="confirm.confirmLabel"></button>
    </div>
  </div>
</div>
{%- endmacro %}
