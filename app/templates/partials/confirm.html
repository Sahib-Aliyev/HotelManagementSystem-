{# Confirmation modal. Bind with confirmMixin() in the page component. #}
{% macro confirm_dialog() -%}
<div x-show="confirm.open" style="display:none" class="fixed inset-0 z-50 grid place-items-center p-4"
     @keydown.escape.window="confirm.open && settleConfirm(false)">
  <div @click="settleConfirm(false)" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-sm animate-fade-up rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900"
       role="dialog" aria-modal="true">
    <div class="flex items-start gap-3">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl"
            :class="confirm.danger
              ? 'bg-red-50 text-red-600 dark:bg-red-500/15 dark:text-red-400'
              : 'bg-brand-50 text-brand-700 dark:bg-brand-700/20 dark:text-brand-200'">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 9v4m0 4h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>
        </svg>
      </span>
      <div class="min-w-0">
        <h3 class="text-base font-semibold text-slate-900 dark:text-white" x-text="confirm.title"></h3>
        <p class="mt-1.5 text-sm leading-relaxed text-slate-600 dark:text-slate-400" x-text="confirm.message"></p>
      </div>
    </div>
    <div class="mt-5 flex gap-2">
      <button @click="settleConfirm(false)"
              class="flex-1 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700
                     transition hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200
                     dark:hover:bg-slate-800">Cancel</button>
      <button @click="settleConfirm(true)"
              class="flex-1 rounded-xl px-4 py-2.5 text-sm font-semibold text-white transition"
              :class="confirm.danger ? 'bg-red-600 hover:bg-red-500' : 'bg-brand-700 hover:bg-brand-600'"
              x-text="confirm.confirmLabel"></button>
    </div>
  </div>
</div>
{%- endmacro %}
